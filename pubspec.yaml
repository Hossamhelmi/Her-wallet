name: her_wallet
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  pinput: ^5.0.1
  connectivity_monitor: ^1.0.8
  flutter_decorated_container: ^1.0.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.2.2
  flutter_bloc: ^9.1.1
  firebase_core: ^4.0.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
